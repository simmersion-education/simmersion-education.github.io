<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forecast Module</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      /*overflow: hidden; */
    }

    /* Scrollable map container */
    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      overflow-x: hidden;
      background-color: #000;
    }

    /* Ratio-locked map wrapper */
    #map-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1750 / 4150;
      background-image: url("obs_holodeck.png");
      background-size: contain;
      background-repeat: no-repeat;
      z-index: 10;
    }

    /* Clickable rooms */
    .room {
      position: absolute;
      cursor: pointer;
      background: rgba(255,0,0,0.22); /* debug mode */
    }

    /* === ROOM COORDINATES === */

    #obs-room {
      top: 3.4%;
      left: 14%;
      width: 71.5%;
      height: 22.9%;
    }


    #geoeng-room {
      top: 26.4%;
      left: 13.5%;
      width: 29.5%;
      height: 19.3%;
    }


    #console-room {
      top: 33.8%;
      left: 56.7%;
      width: 29.0%;
      height: 12.0%;
    }

    #holo-room {
      top: 45.9%;
      left: 13.7%;
      width: 29.1%;
      height: 19.1%;
    }

    #negotiation-room {
      top: 65.1%;
      left: 13.8%;
      width: 29.1%;
      height: 10.5%;
    }


    #resource-room {
      top: 45.8%;
      left: 56.7%;
      width: 29.0%;
      height: 19.3%;
    }


    #bioeng-room {
      top: 65.1%;
      left: 56.7%;
      width: 29.0%;
      height: 10.6%;
    }

    #sciops-room {
      top: 75.7%;
      left: 13.8%;
      width: 71.8%;
      height: 15.8%;
    }


    #elevator-room {
      top: 26.4%;
      left: 43.0%;
      width: 42.4%;
      height: 7.4%;
    }


        /* Collapsible forecast panel */
    #panel {
      position: absolute;
      top: 2%;
      left: 2%;
      width: 260px;
      height: 40px;              /* TRUE collapsed height */
      background: rgba(255,255,255,0.92);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.35);
      z-index: 50;
      transition: all 0.35s ease;
      overflow: hidden;          /* prevents hidden content from expanding box */
      pointer-events: auto;      /* panel can be clicked */
    }

    /* Expanded state */
    #panel.expanded {
      width: 380px;
      height: auto;              /* grows naturally */
      max-height: 80vh;
    }

    /* Header always visible */
    #panel-header {
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(255,255,255,0.95);
      z-index: 51;
    }

    /* Content hidden when collapsed */
    #panel .panel-content {
      opacity: 0;
      max-height: 0;
      padding: 0 12px;
      transition: opacity 0.25s ease, max-height 0.25s ease;
      pointer-events: none;      /* <-- IMPORTANT: content cannot intercept clicks when collapsed */
    }

    /* Content visible when expanded */
    #panel.expanded .panel-content {
      opacity: 1;
      max-height: 1000px;
      padding: 12px;
      pointer-events: auto;      /* content becomes interactive */
    }


  </style>
</head>

<body>

  <!-- Sound cue -->
  <audio id="panel-sound" src="panel-open.mp3" preload="auto"></audio>

  <!-- Scrollable map -->
  <div id="map-container">
    <div id="map-wrapper">

      <!-- Clickable rooms -->
      <div id="obs-room" class="room"></div>
      <div id="geoeng-room" class="room"></div>
      <div id="console-room" class="room"></div>
      <div id="holo-room" class="room"></div>
      <div id="negotiation-room" class="room"></div>
      <div id="resource-room" class="room"></div>
      <div id="bioeng-room" class="room"></div>
      <div id="sciops-room" class="room"></div>
      <div id="elevator-room" class="room"></div>

    </div>
  </div>

  <!-- Forecast panel -->
  <div id="panel">
    <div id="panel-header">Observation Deck</div>

    <div class="panel-content">
      <button id="close-panel">Close</button>

      <p id="scenario">
        A low‑pressure system is approaching from the west.  
        What is your forecast for rainfall probability in the next 6 hours?
      </p>

      <label>Forecast (0–100):</label>
      <input type="range" id="forecast" min="0" max="100" value="50">

      <button id="lock">Lock Forecast</button>
      <button id="reveal" style="display:none;">Reveal Outcome</button>

      <div id="result" style="display:none;">
        <p id="yourForecast"></p>
        <p id="actualOutcome"></p>
        <p id="feedback"></p>
      </div>
    </div>
  </div>

<script>
  /* Collapsible panel logic */
  const panel = document.getElementById("panel");
  const header = document.getElementById("panel-header");
  const closeBtn = document.getElementById("close-panel");
  const sound = document.getElementById("panel-sound");

  header.addEventListener("click", () => {
    if (!panel.classList.contains("expanded")) {
      panel.classList.add("expanded");
      sound.currentTime = 0;
      sound.play();
    }
  });

  closeBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    panel.classList.remove("expanded");
  });

  /* Forecast logic */
  let lockedValue = null;

  document.getElementById("lock").onclick = function() {
    lockedValue = document.getElementById("forecast").value;
    document.getElementById("forecast").disabled = true;
    document.getElementById("lock").disabled = true;
    document.getElementById("reveal").style.display = "block";
  };

  document.getElementById("reveal").onclick = function() {
    const actual = 65;

    document.getElementById("yourForecast").innerText =
      "Your forecast: " + lockedValue;

    document.getElementById("actualOutcome").innerText =
      "Actual outcome: " + actual;

    document.getElementById("feedback").innerText =
      "Difference: " + Math.abs(actual - lockedValue);

    document.getElementById("result").style.display = "block";
  };

  /* Room click handlers */
  const click = msg => () => alert(msg);

  document.getElementById("obs-room").onclick = () => {
    window.location.href = "forecast.html";
  };

  document.getElementById("geoeng-room").onclick = click("GeoEng coming soon!");
  document.getElementById("console-room").onclick = click("Console Room coming soon!");
  document.getElementById("holo-room").onclick = click("Advanced Holographics coming soon!");
  document.getElementById("negotiation-room").onclick = click("Negotiation Space coming soon!");
  document.getElementById("resource-room").onclick = click("Resource Room coming soon!");
  document.getElementById("bioeng-room").onclick = click("BioEng coming soon!");
  document.getElementById("sciops-room").onclick = click("Sci Ops Bay coming soon!");
  document.getElementById("elevator-room").onclick = click("Elevator coming soon!");
</script>

<style>
#cursor-dot {
  position: fixed;
  width: 8px;
  height: 8px;
  background: yellow;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
}
</style>

<div id="cursor-dot"></div>

<script>
window.onload = () => {
  const dot = document.getElementById("cursor-dot");
  const mapContainer = document.getElementById("map-container");
  const mapWrapper = document.getElementById("map-wrapper");

  mapContainer.addEventListener("mousemove", (e) => {
    dot.style.left = e.clientX + "px";
    dot.style.top = e.clientY + "px";

    const rect = mapWrapper.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    console.log(`X: ${x.toFixed(1)}%  Y: ${y.toFixed(1)}%`);
  });
};
</script>
