<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Forecast Module</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* Scrollable map container */
    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow-y: scroll;
      overflow-x: hidden;
      background-color: #000;
    }

    /* Ratio-locked map wrapper */
    #map-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1750 / 4150;
      background-image: url("obs_holodeck.png");
      background-size: contain;
      background-repeat: no-repeat;
      z-index: 10;
    }

    /* Clickable rooms */
    .room {
      position: absolute;
      cursor: pointer;
      background: rgba(255,0,0,0.22); /* debug mode */
    }

    /* === ROOM COORDINATES === */

    #obs-room {
      top: 4.3%;
      left: 10.3%;
      width: 78.9%;
      height: 19.8%;
    }

    #geoeng-room {
      top: 24.8%;
      left: 10.3%;
      width: 78.9%;
      height: 10.8%;
    }

    #console-room {
      top: 30.8%;
      left: 10.3%;
      width: 78.9%;
      height: 10.5%;
    }

    #holo-room {
      top: 36.1%;
      left: 10.3%;
      width: 78.9%;
      height: 16.9%;
    }

    #negotiation-room {
      top: 48.8%;
      left: 10.3%;
      width: 78.9%;
      height: 10.5%;
    }

    #resource-room {
      top: 61.4%;
      left: 10.3%;
      width: 78.9%;
      height: 16.9%;
    }

    #bioeng-room {
      top: 74.8%;
      left: 10.3%;
      width: 78.9%;
      height: 12.5%;
    }

    #sciops-room {
      top: 87.0%;
      left: 10.3%;
      width: 78.9%;
      height: 11.5%;
    }

    #elevator-room {
      top: 22.0%;
      left: 44%;
      width: 12%;
      height: 4.5%;
    }

    /* Collapsible forecast panel */
    #panel {
      position: absolute;
      top: 2%;
      left: 2%;
      width: 220px; /* collapsed */
      padding: 12px;
      background: rgba(255,255,255,0.92);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.35);
      z-index: 50;
      transition: all 0.35s ease;
      overflow: hidden;
      cursor: pointer;
      transform: translateX(-10px);
      opacity: 0.95;
    }

    /* Expanded state */
    #panel.expanded {
      width: 380px;
      max-height: 80vh;
      cursor: default;
      transform: translateX(0);
      opacity: 1;
    }

    /* Hide content when collapsed */
    #panel .panel-content {
      opacity: 0;
      max-height: 0;
      transition: opacity 0.25s ease, max-height 0.25s ease;
    }

    /* Show content when expanded */
    #panel.expanded .panel-content {
      opacity: 1;
      max-height: 1000px;
    }

    /* Close button */
    #close-panel {
      display: none;
      margin-bottom: 10px;
      background: #ddd;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    #panel.expanded #close-panel {
      display: inline-block;
    }

  </style>
</head>

<body>

  <!-- Sound cue -->
  <audio id="panel-sound" src="panel-open.mp3" preload="auto"></audio>

  <!-- Scrollable map -->
  <div id="map-container">
    <div id="map-wrapper">

      <!-- Clickable rooms -->
      <div id="obs-room" class="room"></div>
      <div id="geoeng-room" class="room"></div>
      <div id="console-room" class="room"></div>
      <div id="holo-room" class="room"></div>
      <div id="negotiation-room" class="room"></div>
      <div id="resource-room" class="room"></div>
      <div id="bioeng-room" class="room"></div>
      <div id="sciops-room" class="room"></div>
      <div id="elevator-room" class="room"></div>

    </div>
  </div>

  <!-- Forecast panel -->
  <div id="panel">
    <div class="panel-header">
      <strong>Observation Deck</strong>
    </div>

    <div class="panel-content">
      <button id="close-panel">Close</button>

      <p id="scenario">
        A low‑pressure system is approaching from the west.  
        What is your forecast for rainfall probability in the next 6 hours?
      </p>

      <label>Forecast (0–100):</label>
      <input type="range" id="forecast" min="0" max="100" value="50">

      <button id="lock">Lock Forecast</button>
      <button id="reveal" style="display:none;">Reveal Outcome</button>

      <div id="result" style="display:none;">
        <p id="yourForecast"></p>
        <p id="actualOutcome"></p>
        <p id="feedback"></p>
      </div>
    </div>
  </div>

    const closeBtn = document.getElementById("close-panel");
    const sound = document.getElementById("panel-sound");
